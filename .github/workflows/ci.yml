name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.8.0"

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_ai_test
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        name: Setup Node.js
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Prisma
        uses: actions/cache@v4
        with:
          path: |
            services/backend/src/generated/prisma
            services/backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('services/backend/prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @atlas/backend exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_ai_test?schema=public

      - name: Prisma validate
        run: pnpm --filter @atlas/backend exec prisma validate

      - name: Lint
        run: pnpm --filter @atlas/backend lint

      - name: TypeScript check
        run: pnpm --filter @atlas/backend exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter @atlas/backend test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_ai_test?schema=public

      - name: Build
        run: pnpm --filter @atlas/backend build
