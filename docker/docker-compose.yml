name: atlas-ai-dev

services:
  # ─── Reverse Proxy ──────────────────────────
  traefik:
    image: traefik:v3.2
    container_name: atlas-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--ping=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.atlas.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.ping.rule=Host(`traefik.atlas.local`) && Path(`/ping`)"
      - "traefik.http.routers.ping.service=ping@internal"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  # ─── Database ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-atlas_ai_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atlas-network
    labels:
      - "traefik.enable=false"

  # ─── Cache & Queue ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  # ─── Object Storage ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: atlas-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atlas-network
    labels:
      - "traefik.enable=false"

  # ─── Search ─────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: atlas-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: false
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_ADMIN_PASSWORD:-changeme}"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/config/certs:/usr/share/opensearch/config/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "--user", "admin:${OPENSEARCH_ADMIN_PASSWORD:-changeme}", "https://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - atlas-network

  # ─── Email Testing ──────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: atlas-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - atlas-network

  # ─── Monitoring ─────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: atlas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - atlas-network
    labels:
      - "traefik.enable=false"

  grafana:
    image: grafana/grafana:11.5.0
    container_name: atlas-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - atlas-network
    labels:
      - "traefik.enable=false"

  # ─── Logging ────────────────────────────────
  loki:
    image: grafana/loki:3.4.0
    container_name: atlas-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - atlas-network
    labels:
      - "traefik.enable=false"

  # ─── Backend ────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: atlas-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env.development
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      SEARCH_HOST: opensearch
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atlas_ai_dev?schema=public
      CORS_ORIGIN: http://localhost:3000
      NODE_OPTIONS: "--import tsx/esm"
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok?0:1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - atlas-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.atlas.local`)"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

networks:
  atlas-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
  prometheus-data:
  grafana-data:
  loki-data:
