# Production Docker Compose for Atlas AI.
# Usage:
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Secrets must be provided via environment file or docker secrets.
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.production up -d

name: atlas-ai-prod

services:
  traefik:
    image: traefik:v3.2
    container_name: atlas-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.atlas.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
    networks:
      - atlas-network

  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-atlas_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atlas-network

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  minio:
    image: minio/minio:latest
    container_name: atlas-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - atlas-network

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: atlas-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: false
      plugins.security.ssl.http.enabled: true
      plugins.security.ssl.transport.enabled: true
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-changeme}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/config/securityconfig:/usr/share/opensearch/config/securityconfig:ro
      - ./opensearch/config/certs:/usr/share/opensearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f -u admin:${OPENSEARCH_ADMIN_PASSWORD:-changeme} https://localhost:9200/_cluster/health || curl -f http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - atlas-network

  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: atlas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      backend:
        condition: service_started
    networks:
      - atlas-network

  grafana:
    image: grafana/grafana:11.5.0
    container_name: atlas-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - atlas-network

  loki:
    image: grafana/loki:3.4.0
    container_name: atlas-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - atlas-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: atlas-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env.production
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      SEARCH_HOST: opensearch
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-atlas_ai}?schema=public
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - atlas-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.atlas.local`)"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

networks:
  atlas-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
  prometheus-data:
  grafana-data:
  loki-data:
  traefik-letsencrypt:
