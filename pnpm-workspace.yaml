packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "tests/*"
  - "configs/*"
  - "scripts/*"
  - "tools/*"

catalogs:
  default:
    typescript: ^5.8.0
    vitest: ^3.1.0
    eslint: ^9.24.0
    prettier: ^3.5.0

overrides:
  "@vitejs/plugin-react": "^5.1.4"
  "react-helmet-async": "^3.0.0"
  "@radix-ui/react-slot": "^1.3.0"
  "react-native-helmet-async>react": "^19.0.0"

onlyBuiltDependencies:
  - "@prisma/client"
  - esbuild
  - sharp
